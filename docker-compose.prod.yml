# Produção: Caddy (HTTPS automático) -> Odoo -> Postgres.
# Só o Caddy expõe portas. Configuração no .env (veja .env.example).
x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: 'postgres'
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  odoo:
    image: ${ODOO_IMAGE:-craines/odoo-brasil:18.0}
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # env_file e não ${VAR}: USER/HOST/PASSWORD do shell teriam prioridade
    # sobre o .env na interpolação do compose
    env_file: .env
    environment:
      HOST: db
      PORT: 5432
      USER: ${POSTGRES_USER}
      PASSWORD: ${POSTGRES_PASSWORD}
      ODOO_PORT: 8069
      LONGPOLLING_PORT: 8072
      LOG_FILE: 'False'
    volumes:
      - odoo-data:/var/lib/odoo
    logging: *logging

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - odoo
    environment:
      DOMAIN: ${DOMAIN:?defina DOMAIN no .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

volumes:
  db-data:
  odoo-data:
  caddy-data:
  caddy-config:
